spring.application.name=accounting-service
server.port=8081

# Database Configuration (using H2 for now, can be overridden by docker-compose)
spring.datasource.url=jdbc:h2:mem:accountingdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true

# Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Security Configuration
logging.level.org.springframework.security=DEBUG

# JWT Configuration
ecommerce.app.jwtSecret=secretKeyThatIsLongEnoughToBeSecureAndMeetTheAlgorithmRequirements1234567890

# Kafka Configuration
spring.kafka.consumer.group-id=accounting-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.ecommerce.accounting.dto
