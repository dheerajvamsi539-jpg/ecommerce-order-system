server.port=8090

# Database Configuration (H2 - Temporary fallback due to Postgres auth failure)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.datasource.url=jdbc:h2:mem:ordermgmtdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# Database Configuration (PostgreSQL - Uncomment to use)
# spring.datasource.url=jdbc:postgresql://localhost:5432/ordermgmtdb
# spring.datasource.username=postgres
# spring.datasource.password=password
# spring.datasource.driver-class-name=org.postgresql.Driver
# spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# spring.jpa.hibernate.ddl-auto=update
# spring.jpa.show-sql=true

# Accounting Service
accounting.service.url=${ACCOUNTING_SERVICE_URL:http://localhost:8081/api/accounting}

# JWT Configuration
ecommerce.app.jwtSecret=secretKeyThatIsLongEnoughToBeSecureAndMeetTheAlgorithmRequirements1234567890
ecommerce.app.jwtExpirationMs=86400000

# Kafka Configuration
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer